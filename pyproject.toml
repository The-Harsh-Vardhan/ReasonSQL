[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonsql"
version = "2.0.0"
description = "Natural language to SQL with a LangGraph multi-agent pipeline and hybrid RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt (shared with Docker and Render): install that first.

[project.scripts]
reasonsql = "backend.main:main"

[tool.setuptools.packages.find]
include = ["backend*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Use importlib to avoid ImportPathMismatchError caused by root __init__.py
import_mode = "importlib"
